name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Smoke test (stdio handshake + tools/list)
        run: npm run test:smoke

      - name: Assert cross-client artifacts (cursor / claude-desktop / codex / opencode)
        shell: bash
        run: |
          set -euo pipefail

          # --- Claude Code: writes .mcp.json ---
          npm run setup -- --force >/dev/null
          test -f .mcp.json
          node -e "const j=require('./.mcp.json'); const keys=['log','report','ui','analyzer','code-analyzer','mobile']; for (const k of keys){ if(!j.mcpServers||!j.mcpServers[k]) throw new Error('missing mcpServer: '+k);} console.log('claude-code .mcp.json OK ('+Object.keys(j.mcpServers).length+' servers)');"

          # --- Cursor: writes .cursor/mcp.json + .cursor/rules/*.mdc ---
          npm run setup -- --client cursor --force >/dev/null
          test -f .cursor/mcp.json
          node -e "const j=require('./.cursor/mcp.json'); if(Object.keys(j.mcpServers).length<5) throw new Error('cursor mcp.json missing servers');"
          npm run install:skills -- --client cursor --force >/dev/null
          for n in devtest qa minimize smart-qa; do test -f ".cursor/rules/$n.mdc"; done
          echo "cursor .cursor/{mcp.json,rules/*.mdc} OK"

          # --- Codex CLI: prints TOML; writes ~/.codex/skills + AGENTS.md ---
          out=$(npm run --silent setup -- --client codex)
          echo "$out" | grep -q '\[mcp_servers\.' || (echo "codex setup stdout missing [mcp_servers.*]"; echo "$out"; exit 1)
          npm run install:skills -- --client codex --force >/dev/null
          test -f AGENTS.md
          grep -q '^## devtest' AGENTS.md
          grep -q '^## smart-qa' AGENTS.md
          for n in devtest qa minimize smart-qa; do test -f "$HOME/.codex/skills/$n/SKILL.md"; done
          echo "codex AGENTS.md + ~/.codex/skills/ OK"

          # --- Claude Desktop: prints JSON snippet to stdout (don't touch global config) ---
          out=$(npm run --silent setup -- --client claude-desktop)
          echo "$out" | grep -q '"mcpServers"' || (echo "claude-desktop setup stdout missing mcpServers block"; echo "$out"; exit 1)
          echo "claude-desktop snippet OK"

          # --- opencode: writes to global ~/.config/opencode/opencode.json ---
          npm run setup -- --client opencode --force
          test -f "$HOME/.config/opencode/opencode.json"
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.env.HOME + '/.config/opencode/opencode.json', 'utf8')); if(!j.mcp) throw new Error('opencode.json missing mcp block'); const keys=['log','report','ui','analyzer','code-analyzer','mobile']; for(const k of keys){if(!j.mcp[k]) throw new Error('missing opencode.mcp.'+k); if(!Array.isArray(j.mcp[k].command)) throw new Error('opencode.mcp.'+k+'.command must be array');} console.log('opencode opencode.json OK ('+Object.keys(j.mcp).length+' servers)');"
          
          # Test fallback to global skills if Claude skills are missing
          rm -rf .claude/skills
          npm run install:skills -- --client opencode
          for n in devtest qa minimize smart-qa; do test -f "$HOME/.config/opencode/skills/$n/SKILL.md"; done
          git restore .claude/skills
          echo "opencode global config and skill fallback OK"

      - name: Doctor (info-only on Linux; iOS / adb warnings expected)
        run: node scripts/doctor.mjs || true
